[package]
name = "vmac"
version = "0.0.4"
description = "A modal (evil-style) editor on GPUI, programmable in Lua"
repository = "https://github.com/Super-Yojan/vmac"
homepage = "https://super-yojan.dev/vmac/"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["editor", "vim", "emacs", "gpui", "lua"]
categories = ["text-editors"]
edition = "2024"

[features]
# The window. Without it (--no-default-features) vmac is only the server, for
# remote machines: `vmac connect` installs that one.
default = ["gui"]
gui = ["dep:gpui-kit"]

[dependencies]
anyhow = "1.0.104"
fuzzy-matcher = "0.3"
gpui-kit = { version = "=0.8.0", optional = true }
ignore = "0.4"
libc = "0.2"
libloading = "0.8"
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
portable-pty = "0.9"
qwertty-term-vt = "0.4"
regex = "1"
ropey = "1.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tree-sitter = "0.25"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-go = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-language = "0.1"
tree-sitter-json = "0.24.8"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
