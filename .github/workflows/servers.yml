# Builds the server (vmac without the window) for the systems `vmac connect`
# installs it on, and attaches them to the release of the tag pushed:
# vmac-server-<target>, which `vmac connect` downloads.
#
# Run by hand (Actions > servers > Run workflow): with a tag, it builds that
# tag and attaches the servers to its release (to redo a release's build);
# without one, it only builds, to check that every target still does.
name: servers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (empty: just build)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # The tag being released, if any.
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      # Each target on its own: one failing doesn't stop the others.
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Zig from PyPI, which cargo-zigbuild finds: zig's own download mirrors
      # failed the 0.0.3 build. cargo-zigbuild 0.24 or later knows the linker
      # flags recent Rust passes for arm64.
      - run: pip install ziglang
      - run: cargo install cargo-zigbuild --locked
      - run: cargo zigbuild --release --locked --no-default-features --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/vmac vmac-server-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vmac-server-${{ matrix.target }}
          path: vmac-server-${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        if: env.TAG != ''
        with:
          tag_name: ${{ env.TAG }}
          files: vmac-server-${{ matrix.target }}

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --no-default-features --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/vmac vmac-server-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: vmac-server-${{ matrix.target }}
          path: vmac-server-${{ matrix.target }}
      - uses: softprops/action-gh-release@v2
        if: env.TAG != ''
        with:
          tag_name: ${{ env.TAG }}
          files: vmac-server-${{ matrix.target }}
